<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-12 col-lg-10">
                <form class="row g-3 align-items-end justify-content-center">

                    <div class="col-12 col-md-3">
                        <label for="currencySelect" class="form-label">Currency</label>
                        <select class="form-select" aria-label="Currency" id="currencySelect">
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="startDate" required="true">
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="endDate" required="true">
                    </div>

                    <div class="col-12 col-md-1">
                        <button type="submit" class="btn btn-primary">Chart</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-10">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>
    <div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script src="script.js"></script>
</body>

</html>
